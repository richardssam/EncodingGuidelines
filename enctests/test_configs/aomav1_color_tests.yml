
---
test_av1_color:
  app: ffmpeg
  comparisontest:
  - testtype: ycbcr
    matrix: auto
    range: auto
    # Limits (10-bit code values): just above the zscale result on FFmpeg 6.0 and 9.0, 2026-10-26.
  - testtype: assertresults
    tests:
    - assert: between
      value: white_error_10bit
      between: [-1.5, 1.5]
    - assert: less
      value: p99_error_10bit
      less: 7
    - assert: less
      value: mean_error_10bit
      less: 1.25
  description: av1 color tests of different pix-fmts
  encoding_template: ffmpeg -y {input_args} -i "{source}" {encoding_args} -y "{outfile}"
  name: test_av1_color
  sources:
  - ../sourceimages/chip-chart-1080-16bit-noicc.png.yml
  suffix: .mp4
  wedges:
    av1-yuv422p10le: &baseav1
      -c:v: libaom-av1
      -crf: 25
      -row-mt: 1
      -cpu-used: 6
      -vf: '"zscale=matrix=709:range=limited:filter=lanczos"'
      -color_primaries: bt709
      -color_range: tv
      -color_trc: bt709
      -colorspace: bt709
      -pix_fmt: yuv422p10le
      -strict: experimental
 
    av1-yuv422p10le-cpu5:
      << : *baseav1
      -cpu-used: 5
 
    av1-yuv422p10le-cpu5-g1:
      << : *baseav1
      -g: 1
    
  
    svtav1-yuv422p10le:
      -c:v: libsvtav1 
      -crf: 18
      -row-mt: 1 
      -preset: 9
      -vf: '"zscale=matrix=709:range=limited:filter=lanczos"'
      -color_primaries: bt709
      -color_range: tv
      -color_trc: bt709
      -colorspace: bt709
      -pix_fmt: yuv420p10le
 
---
reports:
  description: This is testing av1 color encoding (both libaom-av1 and libsvtav1)
  directory: aom-av1-color-encode
  name: aom-av1-color-tests
  templatefile: ycbcr.html.jinja
  title: Ffmpeg AV1 encoding color tests
