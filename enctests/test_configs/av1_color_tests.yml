
---
test_av1_color:
  app: ffmpeg
  comparisontest:
  - testtype: ycbcr
    matrix: auto
    range: auto
    # Limits (10-bit code values): just above the zscale result on FFmpeg 6.0 and 9.0, 2026-10-26.
  - testtype: assertresults
    tests:
    # Tags: -color_primaries/-color_trc are ignored from FFmpeg 7.1, so the -vf chain ends with setparams.
    - assert: stringmatch
      value: color_primaries
      string: bt709
    - assert: stringmatch
      value: color_transfer
      string: bt709
    - assert: between
      value: white_error_10bit
      between: [-1.5, 1.5]
    - assert: less
      value: p99_error_10bit
      less: 5
    - assert: less
      value: mean_error_10bit
      less: 0.6
  description: av1 color tests of different pix-fmts
  encoding_template: ffmpeg -y {input_args} -i "{source}" {encoding_args} -y "{outfile}"
  name: test_av1_color
  sources:
  - ../sourceimages/chip-chart-1080-16bit-noicc.png.yml
  suffix: .mp4
  wedges:
    av1-yuv420p10le-preset3: &baseav1
      -c:v: libsvtav1
      -crf: 20
      -svtav1-params: tune=0
      -preset: 3
      -vf: '"zscale=matrix=709:range=limited:filter=lanczos,setparams=color_primaries=bt709:color_trc=bt709"'
      -color_primaries: bt709
      -color_range: tv
      -color_trc: bt709
      -colorspace: bt709
      -pix_fmt: yuv420p10le
      -strict: experimental
      -crf: 10

    av1-yuv420p-preset5:
      << : *baseav1
      -pix_fmt: yuv420p10le
      -preset: 5
 
    av1-yuv420p-preset7:
      << : *baseav1
      -pix_fmt: yuv420p10le
      -preset: 7

    av1-yuv420p-preset9:
      << : *baseav1
      -pix_fmt: yuv420p10le
      -preset: 9
---
reports:
  description: This is testing av1 color encoding.
  directory: av1-color-encode
  name: av1-color-tests
  templatefile: ycbcr.html.jinja
  title: Ffmpeg AV1 encoding color tests
