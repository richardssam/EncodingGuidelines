

test_bitdepth:
  app: ffmpeg
  comparisontest:
  - testtype: ycbcr
    matrix: auto
    range: auto
    # Limits (10-bit code values): just above the zscale result on FFmpeg 6.0 and 9.0, 2026-10-26.
  - testtype: assertresults
    tests:
    - assert: between
      value: white_error_10bit
      between: [-1.5, 1.5]
    - assert: less
      value: p99_error_10bit
      less: 6
    - assert: less
      value: mean_error_10bit
      less: 0.1
  description: Bitdepth tests.
  encoding_template: ffmpeg -y {input_args} -i "{source}"              {encoding_args}
    -y "{outfile}"
  name: test_rgb
  sources:
  - ../sourceimages/chip-chart-1080-16bit-noicc.png.yml
  suffix: .mp4
  wedges:
    h264:
      -c:v: libx264
      -preset: placebo
      -qp: 0
      -pix_fmt: yuv420p
      -vf: '"zscale=matrix=709:range=limited:filter=lanczos"'
      -color_primaries: bt709
      -color_range: tv
      -color_trc: bt709
      -colorspace: bt709
    10bit_h264:
      -c:v: libx264
      -preset: placebo
      -qp: 0
      -pix_fmt: yuv420p10le
      -vf: '"zscale=matrix=709:range=limited:filter=lanczos"'
      -color_primaries: bt709
      -color_range: tv
      -color_trc: bt709
      -colorspace: bt709
    vp9_8bit:
      -c:v: libvpx-vp9
      -quality: good
      -crf: 0
      -pix_fmt: yuv420p
      -colorspace: bt709
      -vf: '"zscale=matrix=709:range=limited:filter=lanczos"'
      -color_range: tv
      -color_primaries: bt709
      -color_range: tv
      -color_trc: bt709
    vp9_10bit:
      -c:v: libvpx-vp9
      -quality: good
      -crf: 0
      -pix_fmt: yuv420p10le
      -colorspace: bt709
      -vf: '"zscale=matrix=709:range=limited:filter=lanczos"'
      -color_range: tv
      -color_primaries: bt709
      -color_range: tv
      -color_trc: bt709
    vp9_12bit:
      -c:v: libvpx-vp9
      -quality: good
      -crf: 0
      -pix_fmt: yuv420p12le
      -colorspace: bt709
      -vf: '"zscale=matrix=709:range=limited:filter=lanczos"'
      -color_primaries: bt709
      -color_range: tv
      -color_trc: bt709

---
reports:
  description: Testing colorbars at different bit-depths for h264 and vp9, showing the file size.
  directory: bitdepth-color-encode
  name: bitdepth-color-tests
  templatefile: ycbcr.html.jinja
  title:  Bit-depth color comparisons. Browser support.
