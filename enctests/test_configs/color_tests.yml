

test_rgb2yuv:
  app: ffmpeg
  comparisontest:
  - testtype: ycbcr
    matrix: bt709
    range: auto
  - testtype: assertresults
    tests:
    - assert: between
      value: white_error_10bit
      between: [-1.5, 1.5]
    - assert: less
      value: max_error_10bit
      less: 2
    - assert: less
      value: mean_error_10bit
      less: 0.1
  description: Testing options for converting RGB to YUV
  encoding_template: ffmpeg -y {input_args} -i "{source}"              {encoding_args} -c:v ffv1
    -y "{outfile}"
  name: test_rgb2yuv
  sources:
  - ../sourceimages/chip-chart-1080-16bit-noicc.png.yml
  - ../sourceimages/smptehdbars_10.dpx.yml
  suffix: .mkv
  # Most wedges here are deliberately wrong methods, kept to show what they do. Their known_issue blocks mean a
  # FAIL is a change: a regression, or a new version behaving differently. Numbers are from 6.1.6 to 9.1.dev.
  wedges:
    10bit_default:
      #-c:v: v410
      -loglevel: verbose
      -strict: -1
      #-sws_flags: spline+accurate_rnd+full_chroma_int+full_chroma_inp
      -pix_fmt: yuv444p10le
      -color_primaries: bt709
      -color_range: tv
      -color_trc: bt709
      -colorspace: bt709
      known_issue:
      - ffmpeg: "<7.1"
        note: "No filter: before 7.1 the -color* flags only label the output, and libswscale converts with its default matrix: max 114 (10-bit)"
      - ffmpeg: ">=7.1"
        note: "No filter: the auto-inserted libswscale converts to BT.709, white +3.5 (10-bit)"
    # The correct conversion, and the base for the others.
    10bit_zscale: &base_args
      -loglevel: verbose
      -strict: -1
      -vf: '"zscale=m=709:min=709:range=limited"'
      -pix_fmt: yuv444p10le
      -color_primaries: bt709
      -color_range: tv
      -color_trc: bt709
      -colorspace: bt709
    10bit_colormatrix:
      << : *base_args
      -vf: '"colormatrix=bt470bg:bt709"'
      known_issue:
        note: "colormatrix after the auto-inserted libswscale conversion: white +3.5, max 10 (10-bit), all versions"
    10bit_colorspace_fast:
      << : *base_args
      -vf: '"colorspace=bt709:iall=bt601-6-625:fast=1"'
      known_issue:
        note: "colorspace fast=1 after the auto-inserted libswscale conversion: white +3.5, max 4 (10-bit), all versions"
    10bit_colorspace:
      << : *base_args
      -vf: '"colorspace=bt709:iall=bt601-6-625:fast=0"'
      known_issue:
        note: "colorspace treats the source as BT.601 625 and converts its primaries and transfer too: max 81 (10-bit), all versions"
    10bit_libswscale:
      << : *base_args
      -vf: '"scale=in_range=full:in_color_matrix=bt709:out_range=tv:out_color_matrix=bt709"'
      known_issue:
        note: "libswscale RGB to limited range: white +3.5 (10-bit) from 10-bit and 16-bit sources, all versions"
    12bit_libswscale:
      << : *base_args
      -pix_fmt: yuv444p12le   
      -vf: '"scale=in_range=full:in_color_matrix=bt709:out_range=tv:out_color_matrix=bt709"'
      known_issue:
        note: "libswscale RGB to limited range: white +3.5 (10-bit) from 10-bit and 16-bit sources, all versions"
    12bit_zscale:
      << : *base_args
      -pix_fmt: yuv444p12le   
      -vf: '"zscale=m=709:min=709:range=limited"'
    8bit_libswscale_full:
      << : *base_args
      -vf: '"scale=in_range=full:in_color_matrix=bt709:out_range=full:out_color_matrix=bt709"'
      -pix_fmt: yuv444p   
      -color_range: pc
      known_issue:
        note: "libswscale RGB to 8-bit full range: white +2, max 8 (10-bit; 2 8-bit code values), all versions"
    10bit_libswscale_full:
      << : *base_args
      -vf: '"scale=in_range=full:in_color_matrix=bt709:out_range=full:out_color_matrix=bt709"'
      -pix_fmt: yuv444p10le
      -color_range: pc
      known_issue:
      - ffmpeg: ">=8.0"
        note: "libswscale RGB to full range: luma gain too high, white +2.8 (10-bit), since 384fe39623"
      - ffmpeg: "<8.0"
        source: "chip-chart*"
        note: "libswscale RGB to full range from 16-bit: within 1 but biased, mean 0.21, white +0.5 (10-bit); exact from the 10-bit bars"
    12bit_libswscale_full:
      << : *base_args
      -vf: '"scale=in_range=full:in_color_matrix=bt709:out_range=full:out_color_matrix=bt709"'
      -pix_fmt: yuv444p12le
      -color_range: pc
      known_issue:
      - ffmpeg: ">=8.0"
        note: "libswscale RGB to full range: luma gain too high, white +2.8 (10-bit), since 384fe39623"
      - ffmpeg: "<8.0"
        source: "smptehdbars*"
        note: "libswscale 10-bit RGB to 12-bit full range: white 3 12-bit code values short (-0.75 10-bit)"
    # The same conversions with libswscale's new conversion code (flags=unstable). Without the flag, 8.1 and 9.0
    # still use the old code for integer formats; see prefer_ops_backend() in libswscale/graph.c.
    10bit_libswscale_unstable:
      << : *base_args
      requires:
        ffmpeg: ">=8.1"   # the unstable flag is new in 8.1
      -vf: '"scale=in_range=full:in_color_matrix=bt709:out_range=tv:out_color_matrix=bt709:flags=unstable"'
      known_issue:
        note: "flags=unstable to limited range: within 1 but biased, mean 0.22 (chip chart) and 0.12 (bars) (10-bit)"
    8bit_libswscale_full_unstable:
      << : *base_args
      requires:
        ffmpeg: ">=8.1"
      -vf: '"scale=in_range=full:in_color_matrix=bt709:out_range=full:out_color_matrix=bt709:flags=unstable"'
      -pix_fmt: yuv444p
      -color_range: pc
      known_issue:
        note: "flags=unstable to 8-bit full range: max 4 (10-bit; one 8-bit code value), mean 0.83 (chip chart), 0.5 (bars)"
    10bit_libswscale_full_unstable:
      << : *base_args
      requires:
        ffmpeg: ">=8.1"
      -vf: '"scale=in_range=full:in_color_matrix=bt709:out_range=full:out_color_matrix=bt709:flags=unstable"'
      -pix_fmt: yuv444p10le
      -color_range: pc
      known_issue:
        source: "chip-chart*"
        note: "flags=unstable to full range from 16-bit: within 1 but biased, mean 0.22 (10-bit); passes on the bars"
    12bit_libswscale_full_unstable:
      << : *base_args
      requires:
        ffmpeg: ">=8.1"
      -vf: '"scale=in_range=full:in_color_matrix=bt709:out_range=full:out_color_matrix=bt709:flags=unstable"'
      -pix_fmt: yuv444p12le
      -color_range: pc
      known_issue:
      - ffmpeg: ">=9.0+dev"
        note: "Development builds after 9.0 log 'No backend found' for gbrp10le to yuv444p12le and fall back to the old code: white +2.8"
      - source: "chip-chart*"
        note: "flags=unstable to 12-bit full range from 16-bit: 1 12-bit code value low on about half the chips, mean 0.12 (10-bit)"

---
reports:
  description: This is testing the different options for converting RGB to YCbCr, stored losslessly with FFV1. Each result is compared with the ideal BT.709 conversion of the source, in 10-bit code values; to pass, the white level must be within 1.5 and every patch within 1 code value, which only an exact conversion achieves.
  directory: color-encode
  name: color-tests
  templatefile: ycbcr.html.jinja
  title: Ffmpeg RGB to YUV conversion options.
