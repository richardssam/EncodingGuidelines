

test_rgb2yuv:
  app: ffmpeg
  comparisontest:
  - testtype: ycbcr
    matrix: bt709
    range: auto
  - testtype: assertresults
    tests:
    - assert: between
      value: white_error_10bit
      between: [-1.5, 1.5]
    - assert: less
      value: max_error_10bit
      less: 2
    - assert: less
      value: mean_error_10bit
      less: 0.1
  description: Testing options for converting RGB to YUV
  encoding_template: ffmpeg -y {input_args} -i "{source}"              {encoding_args}
    -y "{outfile}"
  name: test_rgb2yuv
  sources:
  - ../sourceimages/chip-chart-1080-16bit-noicc.png.yml
  - ../sourceimages/smptehdbars_10.dpx.yml
  suffix: .y4m
  wedges:
    10bit_default:
      #-c:v: v410
      -loglevel: verbose
      -strict: -1
      #-sws_flags: spline+accurate_rnd+full_chroma_int+full_chroma_inp
      -pix_fmt: yuv444p10le
      -color_primaries: bt709
      -color_range: tv
      -color_trc: bt709
      -colorspace: bt709
    10bit_colormatrix: &base_args
      -loglevel: verbose
      -strict: -1
      -vf: '"colormatrix=bt470bg:bt709"'
      -pix_fmt: yuv444p10le
      -color_primaries: bt709
      -color_range: tv
      -color_trc: bt709
      -colorspace: bt709
    10bit_colorspace_fast:
      << : *base_args
      -vf: '"colorspace=bt709:iall=bt601-6-625:fast=1"'
    10bit_colorspace:
      << : *base_args
      -vf: '"colorspace=bt709:iall=bt601-6-625:fast=0"'
    10bit_libswscale:
      << : *base_args
      -vf: '"scale=in_range=full:in_color_matrix=bt709:out_range=tv:out_color_matrix=bt709"'
    10bit_zscale:
      << : *base_args
      -vf: '"zscale=m=709:min=709:range=limited"'
    12bit_libswscale:
      << : *base_args
      -pix_fmt: yuv444p12le   
      -vf: '"scale=in_range=full:in_color_matrix=bt709:out_range=tv:out_color_matrix=bt709"'
    12bit_zscale:
      << : *base_args
      -pix_fmt: yuv444p12le   
      -vf: '"zscale=m=709:min=709:range=limited"'
    8bit_libswscale_full:
      << : *base_args
      -vf: '"scale=in_range=full:in_color_matrix=bt709:out_range=full:out_color_matrix=bt709"'
      -pix_fmt: yuv444p   
      -color_range: pc
    10bit_libswscale_full:
      << : *base_args
      -vf: '"scale=in_range=full:in_color_matrix=bt709:out_range=full:out_color_matrix=bt709"'
      -pix_fmt: yuv444p10le  
      -color_range: pc
    12bit_libswscale_full:
      << : *base_args
      -vf: '"scale=in_range=full:in_color_matrix=bt709:out_range=full:out_color_matrix=bt709"'
      -pix_fmt: yuv444p12le  
      -color_range: pc

---
reports:
  description: This is testing the different options for converting RGB to YCbCr, using y4m as a container of raw YCbCr data. Each result is compared with the ideal BT.709 conversion of the source, in 10-bit code values; to pass, the white level must be within 1.5 and every patch within 1 code value, which only an exact conversion achieves.
  directory: color-encode
  name: color-tests
  templatefile: colorweb.html.jinja
  title: Ffmpeg RGB to YUV conversion options.
