
---
test_dnxhd_444:
  app: ffmpeg
  comparisontest:
  - testtype: ycbcr
    matrix: auto
    range: auto
    # Limits (10-bit code values): just above the zscale result on FFmpeg 6.0 and 9.0, 2026-10-26.
  - testtype: assertresults
    tests:
    # Tags: -color_primaries/-color_trc are ignored from FFmpeg 7.1, so the -vf chain ends with setparams.
    - assert: stringmatch
      value: color_primaries
      string: bt709
    - assert: stringmatch
      value: color_transfer
      string: bt709
    - assert: between
      value: white_error_10bit
      between: [-1.5, 1.5]
    - assert: less
      value: p99_error_10bit
      less: 2
    - assert: less
      value: mean_error_10bit
      less: 0.15
    - assert: less
      value: max_error_10bit
      less: 4
  description: dnxhd color tests of different pix-fmts
  encoding_template: ffmpeg -y {input_args} -i "{source}"              {encoding_args}
    -y "{outfile}"
  name: test_dnxhd_color
  sources:
  - ../sourceimages/chip-chart-1080-16bit-noicc.png.yml
  suffix: .mov
  wedges:
    dnxhd-yuv444p10le: &basednxhd
      -c:v: dnxhd
      -profile:v: dnxhr_444
      -vf: '"zscale=matrix=709:range=limited:filter=lanczos,setparams=color_primaries=bt709:color_trc=bt709"'
      -color_primaries: bt709
      -color_range: tv
      -color_trc: bt709
      -colorspace: bt709
      -pix_fmt: yuv444p10le
      -strict: experimental
      #-preset: 3
      #-tag:v: hvc1


      #-profile:v: main444-10

    dnxhd-yuv444p10le-440m:
      << : *basednxhd
      -b:v: 440m

    dnxhd-gbrp10:
      << : *basednxhd
      -vf: '"zscale=range=full,setparams=color_primaries=bt709:color_trc=bt709"'
      # RGB is full range; with tv (inherited) FFmpeg 7.1+ makes libswscale do the bit depth change.
      -color_range: pc
      -colorspace: rgb
      -pix_fmt: gbrp10le

    dnxhd-gbrp10full:
      << : *basednxhd
      -vf: '"scale=in_range=full:in_color_matrix=bt709:out_range=full:out_color_matrix=bt709,setparams=color_primaries=bt709:color_trc=bt709"'
      -color_range: pc
      -colorspace: rgb
      -pix_fmt: gbrp10le

    dnxhd-yuv444full:
      << : *basednxhd
      -vf: '"zscale=matrix=709:range=full:filter=lanczos,setparams=color_primaries=bt709:color_trc=bt709"'
      -color_range: pc
      #-colorspace: rgb
      #-pix_fmt: gbrp10le
 
test_dnxhd_422:
  app: ffmpeg
  comparisontest:
  - testtype: ycbcr
    matrix: auto
    range: auto
    # Limits (10-bit code values): just above the zscale result on FFmpeg 6.0 and 9.0, 2026-10-26.
  - testtype: assertresults
    tests:
    # Tags: -color_primaries/-color_trc are ignored from FFmpeg 7.1, so the -vf chain ends with setparams.
    - assert: stringmatch
      value: color_primaries
      string: bt709
    - assert: stringmatch
      value: color_transfer
      string: bt709
    - assert: between
      value: white_error_10bit
      between: [-1.5, 1.5]
    - assert: less
      value: p99_error_10bit
      less: 6
    - assert: less
      value: mean_error_10bit
      less: 0.3
    - assert: less
      value: max_error_10bit
      less: 16
  description: dnxhd color tests of different pix-fmts
  encoding_template: ffmpeg -y {input_args} -i "{source}"              {encoding_args}
    -y "{outfile}"
  name: test_dnxhd_color
  sources:
  - ../sourceimages/chip-chart-1080-16bit-noicc.png.yml
  suffix: .mov
  wedges:
    dnxhqx: &basednxhqx
      -c:v: dnxhd
      -profile:v: dnxhr_hqx
      -b:v: 440m
      -vf: '"zscale=matrix=709:range=limited:filter=lanczos,setparams=color_primaries=bt709:color_trc=bt709"'
      -color_primaries: bt709
      -color_range: tv
      -color_trc: bt709
      -colorspace: bt709
      -pix_fmt: yuv422p10le
      #-preset: 3
      #-tag:v: hvc1


      #-profile:v: main444-10

    p10_440M:
      << : *basednxhqx
      -profile:v: dnxhd
      -pix_fmt: yuv422p10
      -b:v: 440M

    p10_365M:
      << : *basednxhqx
      -profile:v: dnxhd
      -pix_fmt: yuv422p10
      -b:v: 365M

    p10_185M:
      << : *basednxhqx
      -profile:v: dnxhd
      -pix_fmt: yuv422p10
      -b:v: 185M

    p10_175M:
      << : *basednxhqx
      -profile:v: dnxhd
      -pix_fmt: yuv422p10
      -b:v: 175M
  
    440M:
      << : *basednxhqx
      -profile:v: dnxhr_hq
      -pix_fmt: yuv422p
      -b:v: 440M

    185M:
      << : *basednxhqx
      -profile:v: dnxhr_hq
      -pix_fmt: yuv422p
      -b:v: 185M

    115M:
      << : *basednxhqx
      -profile:v: dnxhr_hq
      -pix_fmt: yuv422p
      -b:v: 115M

