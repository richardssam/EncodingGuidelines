
test_mov:
    name: test_mov
    description: A comparison of different codecs with uncompressed settings, with VMAF > 98.
    app: ffmpeg
    comparisontest:
    - testtype: ycbcr
      matrix: auto
      range: auto
      # Limits (10-bit code values): just above the zscale result on FFmpeg 6.0 and 9.0, 2026-10-26.
      # The wedge with no filter converts with libswscale and fails white_error.
    - testtype: assertresults
      tests:
      - assert: between
        value: white_error_10bit
        between: [-1.5, 1.5]
      - assert: less
        value: p99_error_10bit
        less: 2
      - assert: less
        value: mean_error_10bit
        less: 0.1
    suffix: .mov
    encoding_template: 'ffmpeg -color_trc smpte2084   -color_primaries bt2020   -colorspace bt2020nc {input_args} -i "{source}" -frames:v {duration} {encoding_args} -y "{outfile}"'
    sources:
    - ../sourceimages/smptehdbars_10.dpx.yml
    - ../sourceimages/stilllife_rec2020pq.png
    wedges:

        libx265-10bit: 
            -c:v: libx265
            -pix_fmt: yuv444p10le
            -sws_flags: print_info+accurate_rnd+bitexact+full_chroma_int 
            -x265-params: lossless=1:colorprim=bt2020:transfer=smpte2084:colormatrix=bt2020nc:range=limited:master-display=G(13250,34500)B(7500,3000)R(34000,16000)WP(15635,16450)L(10000000,1):max-cll=1000,400
            -color_range: tv
            -colorspace: bt2020nc
            -color_primaries: bt2020
            -color_trc: smpte2084
            -tag:v: hvc1

        libx265-10bit-scale: 
            -c:v: libx265
            -pix_fmt: yuv444p10le
            -sws_flags: print_info+accurate_rnd+bitexact+full_chroma_int 
            -x265-params: lossless=1:colorprim=bt2020:transfer=smpte2084:colormatrix=bt2020nc:range=limited:master-display=G(13250,34500)B(7500,3000)R(34000,16000)WP(15635,16450)L(10000000,1):max-cll=1000,400
            -vf: '"zscale=matrix=2020_ncl:range=limited:filter=lanczos,setparams=color_primaries=bt2020:color_trc=smpte2084"'
            -color_range: tv
            -colorspace: bt2020nc
            -color_primaries: bt2020
            -color_trc: smpte2084
            -tag:v: hvc1

        libx265-10bit-scale_hdr_opt: 
            -c:v: libx265
            -pix_fmt: yuv444p10le
            -sws_flags: print_info+accurate_rnd+bitexact+full_chroma_int 
            -x265-params: hdr-opt=1:lossless=1:colorprim=bt2020:transfer=smpte2084:colormatrix=bt2020nc:range=limited:master-display=G(13250,34500)B(7500,3000)R(34000,16000)WP(15635,16450)L(10000000,1):max-cll=1000,400
            -vf: '"zscale=matrix=2020_ncl:range=limited:filter=lanczos,setparams=color_primaries=bt2020:color_trc=smpte2084"'
            -color_range: tv
            -colorspace: bt2020nc
            -color_primaries: bt2020
            -color_trc: smpte2084
            -tag:v: hvc1

        libx265-10bit-scale_basic: 
            -c:v: libx265
            -pix_fmt: yuv444p10le
            -sws_flags: print_info+accurate_rnd+bitexact+full_chroma_int 
            -x265-params: lossless=1
            -vf: '"zscale=matrix=2020_ncl:range=limited:filter=lanczos,setparams=color_primaries=bt2020:color_trc=smpte2084"'
            -color_range: tv
            -colorspace: bt2020nc
            -color_primaries: bt2020
            -color_trc: smpte2084
            -tag:v: hvc1

        libx265-10bit-scale_max-cll: 
            -c:v: libx265
            -pix_fmt: yuv444p10le
            -sws_flags: print_info+accurate_rnd+bitexact+full_chroma_int 
            -x265-params: lossless=1:max-cll=400,100
            -vf: '"zscale=matrix=2020_ncl:range=limited:filter=lanczos,setparams=color_primaries=bt2020:color_trc=smpte2084"'
            -color_range: tv
            -colorspace: bt2020nc
            -color_primaries: bt2020
            -color_trc: smpte2084
            -tag:v: hvc1
---

reports:
    name: hdr-color-test
    title: Comparison of hdr processing.
    description: This is comparing encoding mechanisms for HDR.
    directory: hdr-color-encode
    templatefile: ycbcr.html.jinja

