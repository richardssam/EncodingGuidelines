
---
test_h265_color:
  app: ffmpeg
  comparisontest:
  - testtype: ycbcr
    matrix: auto
    range: auto
    # Limits (10-bit code values): just above the zscale result on FFmpeg 6.0 and 9.0, 2026-10-26.
  - testtype: assertresults
    tests:
    - assert: between
      value: white_error_10bit
      between: [-1.5, 1.5]
    - assert: less
      value: p99_error_10bit
      less: 2
    - assert: less
      value: mean_error_10bit
      less: 0.1
    - assert: less
      value: max_error_10bit
      less: 2
  description: h265 color tests of different pix-fmts
  encoding_template: ffmpeg -y {input_args} -i "{source}"              {encoding_args}
    -y "{outfile}"
  name: test_h265_color
  sources:
  - ../sourceimages/chip-chart-1080-noicc.png.yml
  - ../sourceimages/chip-chart-1080-16bit-noicc.png.yml
  - ../sourceimages/smptehdbars_16.png.yml
  suffix: .mp4
  wedges:
    yuv444p10lex265: &basex265
      -c:v: libx265
      -vf: '"zscale=matrix=709:range=limited:filter=lanczos"'
      -color_primaries: bt709
      -color_range: tv
      -color_trc: bt709
      -colorspace: bt709
      -pix_fmt: yuv444p10le
      -preset: placebo
      -x265-params: lossless=1
      -tag:v: hvc1
      -profile:v: main444-10


    gbrpx265:
      << : *basex265
      -vf: '"zscale=range=full"'
      -color_range: pc
      -colorspace: rgb
      -pix_fmt: gbrp

    gbrp10x265:
      << : *basex265
      -vf: '"zscale=range=full"'
      -color_range: pc
      -colorspace: rgb
      -pix_fmt: gbrp10le

    gbrp12x265:
      << : *basex265
      -vf: '"zscale=range=full"'
      -color_range: pc
      -colorspace: rgb
      -profile:v: main444-12
      -pix_fmt: gbrp12le

    yuv444p12lefullx265:
      << : *basex265
      -vf: '"zscale=matrix=709:range=full:filter=lanczos"'
      -color_range: pc
    
    videotoolbox_h265_bgra:
      << : *basex265
      -c:v: hevc_videotoolbox
      -vf: '"null"'
      -color_range: pc
      -colorspace: rgb
      -profile:v: main
      -pix_fmt: bgra

---
test_h265_color_420:
  app: ffmpeg
  comparisontest:
  - testtype: ycbcr
    matrix: auto
    range: auto
    # Limits (10-bit code values): just above the zscale result on FFmpeg 6.0 and 9.0, 2026-10-26.
    # hevc_videotoolbox (lossy, default quality) sets these; x265 is within 2 / 0.1.
  - testtype: assertresults
    tests:
    - assert: between
      value: white_error_10bit
      between: [-1.5, 1.5]
    - assert: less
      value: p99_error_10bit
      less: 10
    - assert: less
      value: mean_error_10bit
      less: 1.0
  description: h265 color tests of different pix-fmts
  encoding_template: ffmpeg -y {input_args} -i "{source}"              {encoding_args}
    -y "{outfile}"
  name: test_h265_color
  sources:
  - ../sourceimages/chip-chart-1080-16bit-noicc.png.yml
  suffix: .mp4
  wedges:
    yuv420p10le: &basex265
      -c:v: libx265
      -vf: '"zscale=matrix=709:range=limited:filter=lanczos"'
      -color_primaries: bt709
      -color_range: tv
      -color_trc: bt709
      -colorspace: bt709
      -pix_fmt: yuv420p10le
      -preset: placebo
      -x265-params: lossless=1
      -tag:v: hvc1
      -profile:v: main444-10

    yuv420p10le-full:
      << : *basex265
      -vf: '"zscale=matrix=709:range=full:filter=lanczos"'
      -color_range: pc
  
    yuv420p:
      << : *basex265
      -pix_fmt: yuv420p

    vyuv420p-videotoolbox:
      << : *basex265
      -c:v: hevc_videotoolbox
      #-vf: '"zscale=matrix=709:range=full:filter=lanczos"'
      -color_range: tv
      -profile:v: main
      -pix_fmt: yuv420p

---
reports:
  description: This is testing h265 color encoding.
  directory: hevc-color-encode
  name: hevc-color-tests
  templatefile: ycbcr.html.jinja
  title: h265 color tests
