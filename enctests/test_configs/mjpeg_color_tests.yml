
---
test_mjpeg_444:
  app: ffmpeg
  comparisontest:
  - testtype: ycbcr
    matrix: auto
    range: auto
    # Limits (10-bit code values): just above the zscale result on FFmpeg 6.0 and 9.0, 2026-10-26.
    # The libswscale wedges convert to BT.709 but are tagged BT.601, so they fail. No max_error: it is one pixel,
    # set by compression (4:2:2 gives 12-16).
  - testtype: assertresults
    tests:
    - assert: between
      value: white_error_10bit
      between: [-1.5, 1.5]
    - assert: less
      value: p99_error_10bit
      less: 10
    - assert: less
      value: mean_error_10bit
      less: 1.5
  description: mjpeg color tests of different pix-fmts
  encoding_template: ffmpeg -y {input_args} -i "{source}"              {encoding_args}
    -y "{outfile}"
  name: test_mjpeg_444
  sources:
  - ../sourceimages/chip-chart-1080-noicc.png.yml
  suffix: .mov
  wedges:
    mjpeg: &basemjpeg
      -c:v: mjpeg
      -q:v: 2
      # JPEG is full range; 6.1 refuses limited-range yuv444p/yuv422p ("Non full-range YUV is non-standard").
      -color_range: pc
      #-pix_fmt: yuv444p

    mjpeg-yuv444p: 
      << : *basemjpeg
      -c:v: mjpeg
      -q:v: 2
      -pix_fmt: yuv444p

    mjpeg-yuv444p-libswscale:
      << : *basemjpeg
      -vf: '"scale=in_color_matrix=bt709:out_color_matrix=bt709"'
      -color_primaries: bt709
      -color_range: pc
      -color_trc: bt709
      -colorspace: bt709

    mjpeg-yuv444p-libswscale-full:
      << : *basemjpeg
      -vf: '"scale=in_color_matrix=bt709:out_color_matrix=bt709"'
      -color_primaries: bt709
      -color_range: pc
      -color_trc: bt709
      -colorspace: bt709
 
