

test_rgb:
  app: ffmpeg
  comparisontest:
  - testtype: ycbcr
    matrix: auto
    range: auto
    # Limits (10-bit code values): just above the zscale result on FFmpeg 6.0 and 9.0, 2026-10-26.
  - testtype: assertresults
    tests:
    - assert: between
      value: white_error_10bit
      between: [-1.5, 1.5]
    - assert: less
      value: p99_error_10bit
      less: 1
    - assert: less
      value: mean_error_10bit
      less: 0.1
    - assert: less
      value: max_error_10bit
      less: 2
  description: Uncompressed tests.
  encoding_template: ffmpeg -y {input_args} -i "{source}"              {encoding_args}
    -y "{outfile}"
  name: test_rgb
  sources:
  - ../sourceimages/chip-chart-1080-16bit-noicc.png.yml
  - ../sourceimages/smptehdbars_16.png.yml
  suffix: .mp4
  wedges:
    10bit_h264:
      -c:v: libx264
      -preset: placebo
      -qp: 0
      -pix_fmt: yuv444p10le
      -vf: '"zscale=matrix=709:range=limited:filter=lanczos"'
      -color_primaries: bt709
      -color_range: tv
      -color_trc: bt709
      -colorspace: bt709
    16bit_png:
      -c:v: png
      -pix_fmt: rgb48be
      -colorspace: rgb
      -vf: '"zscale=range=full"'
      -color_range: pc
      -color_primaries: bt709
      -color_trc: bt709
    vp9_10bit_rgb:
      -c:v: libvpx-vp9
      -quality: good
      -crf: 0
      -speed: 2
      -row-mt: 1
      -pix_fmt: gbrp10le
      -colorspace: rgb
      -vf: '"zscale=range=full"'
      -color_range: pc
      -color_primaries: bt709
      -color_trc: bt709
    vp9_12bit_rgb:
      -c:v: libvpx-vp9
      -quality: good
      -crf: 0
      -speed: 2
      -row-mt: 1
      -pix_fmt: gbrp12le
      -colorspace: rgb
      -vf: '"zscale=range=full"'
      -color_range: pc
      -color_primaries: bt709
      -color_trc: bt709

test_rgb8:
  app: ffmpeg
  comparisontest:
  - testtype: ycbcr
    matrix: auto
    range: auto
    # Limits (10-bit code values): just above the zscale result on FFmpeg 6.0 and 9.0, 2026-10-26.
    # 8bit_mjpeg fails: MJPEG cannot store RGB, so it is converted to full range BT.601 Y'CbCr.
  - testtype: assertresults
    tests:
    - assert: between
      value: white_error_10bit
      between: [-1.5, 1.5]
    - assert: less
      value: p99_error_10bit
      less: 1
    - assert: less
      value: mean_error_10bit
      less: 0.1
    - assert: less
      value: max_error_10bit
      less: 2
  description: Uncompressed tests.
  encoding_template: ffmpeg -y {input_args} -i "{source}"              {encoding_args}
    -y "{outfile}"
  name: test_rgb8
  sources:
  - ../sourceimages/chip-chart-1080-noicc.png.yml
  suffix: .mp4
  wedges:
    8bit_h264:
      -c:v: libx264
      -pix_fmt: yuv444p
      -preset: placebo
      -qp: 0
      -vf: '"zscale=matrix=709:range=limited:filter=lanczos"'
      -color_primaries: bt709
      -color_range: tv
      -color_trc: bt709
      -colorspace: bt709
    8bit_libx264rgb:
      -c:v: libx264rgb
      -pix_fmt: rgb24
      -preset: placebo 
      -qp: 0
      -colorspace: rgb
      -vf: '"zscale=range=full"'
      -x264-params: "keyint=15:no-deblock=1"
      -color_range: pc
      -color_primaries: bt709
      -color_trc: bt709
    8bit_png:
      -c:v: png
      -pix_fmt: rgb24
      -colorspace: rgb
      -vf: '"zscale=range=full"'
      -color_range: pc
      -color_primaries: bt709
      -color_trc: bt709
    8bit_mjpeg:
      -c:v: mjpeg
      -pix_fmt: rgb24
      -colorspace: rgb
      -q:v: 2 
      -vf: '"scale=in_range=full:out_range=full"'
      -color_range: pc
      -color_primaries: bt709
      -color_trc: bt709
    vp9_8bit_rgb:
      -c:v: libvpx-vp9
      -quality: good
      -crf: 0
      -pix_fmt: gbrp
      -colorspace: rgb
      -vf: '"zscale=range=full"'
      -color_range: pc
      -color_primaries: bt709
      -color_trc: bt709

test_rgb_mov:
  app: ffmpeg
  comparisontest:
  - testtype: ycbcr
    matrix: auto
    range: auto
    # Limits (10-bit code values): just above the zscale result on FFmpeg 6.0 and 9.0, 2026-10-26.
  - testtype: assertresults
    tests:
    - assert: between
      value: white_error_10bit
      between: [-1.5, 1.5]
    - assert: less
      value: p99_error_10bit
      less: 1
    - assert: less
      value: mean_error_10bit
      less: 0.1
    - assert: less
      value: max_error_10bit
      less: 4
  description: Uncompressed tests.
  encoding_template: ffmpeg -y {input_args} -i "{source}"              {encoding_args}
    -y "{outfile}"
  name: test_rgb
  sources:
  - ../sourceimages/chip-chart-1080-16bit-noicc.png.yml
  - ../sourceimages/chip-chart-1080-noicc.png.yml
  - ../sourceimages/smptehdbars_16.png.yml
  suffix: .mov
  wedges:
    10bit_dnxhd:  &base_args2
      -c:v: dnxhd
      -pix_fmt: gbrp10le
      -vf: '"zscale=range=full"'
      -profile:v: dnxhr_444
      -color_primaries: bt709
      -color_range: pc
      -color_trc: bt709
      -colorspace: rgb
