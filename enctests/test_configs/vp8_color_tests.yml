---
test_vp8_color_420:
  app: ffmpeg
  comparisontest:
  - testtype: ycbcr
    matrix: auto
    range: auto
    # Limits (10-bit code values): just above the zscale result on FFmpeg 6.0 and 9.0, 2026-10-26.
  - testtype: assertresults
    tests:
    - assert: between
      value: white_error_10bit
      between: [-1.5, 1.5]
    - assert: less
      value: p99_error_10bit
      less: 10
    - assert: less
      value: mean_error_10bit
      less: 1.5
  description: vp9 color tests of different pix-fmts
  encoding_template: ffmpeg -y {input_args} -i "{source}"              {encoding_args}
    -y "{outfile}"
  name: test_vp8_color_420
  sources:
  - ../sourceimages/chip-chart-1080-16bit-noicc.png.yml
  suffix: .mkv
  wedges:
    vp8-yuv420p10le-good: &basevp8
      -c:v: libvpx
      -quality: good
      -crf: 4
      -b:v: 200M
      -vf: '"zscale=matrix=709:range=limited:filter=lanczos"'
      -color_primaries: bt709
      -color_range: tv
      -color_trc: bt709
      -colorspace: bt709
      -pix_fmt: yuv444p10le
      -strict: experimental
  
    vp8-yuv420p-best:
      << : *basevp8
      -pix_fmt: yuv420p

    vp8-yuv420p-bv0:
      << : *basevp8
      -pix_fmt: yuv420p
      -b:v: 0

    vp8-yuv420p-qminmax:
      << : *basevp8
      -pix_fmt: yuv420p
      -qmin: 0
      -qmax: 50
---
reports:
  description: This is testing vp9 color encoding.
  directory: vp9-color-encode
  name: vp9-color-tests
  templatefile: ycbcr.html.jinja
  title: Ffmpeg vp9 encoding color tests
