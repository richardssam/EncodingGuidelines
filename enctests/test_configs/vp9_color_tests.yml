---
test_vp9_color_444:
  app: ffmpeg
  comparisontest:
  - testtype: ycbcr
    matrix: auto
    range: auto
    # Limits (10-bit code values): just above the zscale result on FFmpeg 6.0 and 9.0, 2026-10-26.
  - testtype: assertresults
    tests:
    - assert: between
      value: white_error_10bit
      between: [-1.5, 1.5]
    - assert: less
      value: p99_error_10bit
      less: 2
    - assert: less
      value: mean_error_10bit
      less: 0.1
  description: vp9 color tests of different pix-fmts
  encoding_template: ffmpeg -y {input_args} -i "{source}"              {encoding_args}
    -y "{outfile}"
  name: test_vp9_color_444
  sources:
  - ../sourceimages/chip-chart-1080-16bit-noicc.png.yml
  suffix: .mp4
  wedges:
    vp9-yuv420p10le-good: &basevp9
      -c:v: libvpx-vp9
      -quality: good
      -crf: 0
      -vf: '"zscale=matrix=709:range=limited:filter=lanczos"'
      -color_primaries: bt709
      -color_range: tv
      -color_trc: bt709
      -colorspace: bt709
      -pix_fmt: yuv444p10le
      -strict: experimental

    vp9-gbrp:
      << : *basevp9
      -vf: '"zscale=range=full"'
      -pix_fmt: gbrp
      -color_range: pc
      -colorspace: rgb

    vp9-gbrp10le:
      << : *basevp9
      -vf: '"zscale=range=full"'
      -pix_fmt: gbrp10le
      -color_range: pc
      -colorspace: rgb

    vp9-gbrp12le:
      << : *basevp9
      -vf: '"zscale=range=full"'
      -pix_fmt: gbrp12le
      -color_range: pc
      -colorspace: rgb

    vp9-yuv444p10le-best:
      << : *basevp9
      -pix_fmt: yuv444p10le
      -quality: best

    vp9-yuv444p10le-lossless:
      << : *basevp9
      -pix_fmt: yuv444p10le
      -lossless: 1
---
